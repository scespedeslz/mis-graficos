<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamgraph Energía</title>
<style>
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #f4f7f6; 
        color: #333; 
        margin: 0; 
        padding: 40px; 
        text-align: center; 
    }
    h1 { color: #2c3e50; margin-bottom: 20px; }
    .container { 
        max-width: 900px; 
        margin: auto; 
        background: white; 
        padding: 30px; 
        border-radius: 15px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
    }
    h2 { color: #2c3e50; margin-bottom: 10px; }
    p { color: #5d6d7e; margin-bottom: 25px; line-height: 1.5; }
    img { width: 100%; height: auto; border-radius: 10px; }
</style>
</head>
<body>

<div class="container">
    <h1>Streamgraph de Energía</h1>

    <section id="grafico-energia">
        <h2>¿Cómo influyen mis hábitos diarios en la distribución de mi energía vital?</h2>
        <p>Para este prototipo, utilicé este gráfico para procesar un registro de una semana de datos personales. Clasifiqué las actividades en categorías (Salud, Alimentación, Productivo, Ocio y Descanso).</p>
        <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
            <img src="energia-streamgraph.svg" alt="Streamgraph de Energía Diaria">
        </div>
    </section>
</div>

</body>
</html>
