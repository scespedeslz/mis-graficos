<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Graficos tp1</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 40px; 
            text-align: center; 
        }
        h1 { 
            color: #2c3e50; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .viz-section { 
            margin-bottom: 50px; 
            padding: 20px; 
            border-bottom: 1px solid #eee; 
        }
        h2 { 
            color: #4A5BFF; 
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 10px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mis Gráficos TP1</h1>

        <section id="grafico-energia" class="viz-section">
            <h2 style="color: #2c3e50;">¿Cómo influyen mis hábitos diarios en la distribución de mi energía vital?</h2>
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
                <img src="agrupacion.viz.svg" alt="Streamgraph de Energía Diaria">
            </div>
        </section>

        <section id="heatmap-flourish" class="viz-section">
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                
                <div class="flourish-embed flourish-chart" data-src="visualisation/28648855">
                    <script src="https://public.flourish.studio/resources/embed.js"></script>
                    <noscript>
                        <img src="https://public.flourish.studio/visualisation/28648855/thumbnail" width="100%" alt="visualization" />
                    </noscript>
                </div>
                </div>
        </section>
        <section id="datawrapper-balance" class="viz-section">
            <h2 style="color: #2c3e50;">Balance Mensual: Análisis de Bienestar y Productividad</h2>
            <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                
                <iframe title="Análisis Mensual: Bienestar y Productividad" aria-label="Column Chart" id="datawrapper-chart-WORfD" src="https://datawrapper.dwcdn.net/WORfD/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="442" data-external="1"></iframe>
                
                <script type="text/javascript">
                    window.addEventListener("message", function(a) {
                        if (void 0 !== a.data["datawrapper-height"]) {
                            var e = document.querySelectorAll("iframe");
                            for (var t in a.data["datawrapper-height"])
                                for (var r, i = 0; r = e[i]; i++)
                                    if (r.contentWindow === a.source) {
                                        var d = a.data["datawrapper-height"][t] + "px";
                                        r.style.height = d
                                    }
                        }
                    });
                </script>

            </div>
        </section>
    </div>
    

</body>
</html>
