<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Streamgraph Energía</title>
<style>
    body { 
        margin: 0; 
        padding: 40px; 
        background-color: #f0f2f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
    }
    .contenedor-blanco {
        background: white; 
        padding: 30px; 
        border-radius: 15px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        text-align: center;
        max-width: 800px;
        width: 100%;
    }
    h2 { color: #2c3e50; margin-bottom: 10px; }
    p { color: #5d6d7e; margin-bottom: 25px; line-height: 1.5; }
    svg { width: 100%; height: auto; border-radius: 10px; }
</style>
</head>
<body>
<section class="contenedor-blanco">
    <h2>¿Cómo influyen mis hábitos diarios en la distribución de mi energía vital?</h2>
    <p>Gráfico de ejemplo con 3 categorías de energía: Salud, Productivo y Ocio.</p>

    <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Salud -->
        <path d="M0,200 C100,180 200,220 300,200 400,180 500,220 600,200 700,180 800,200" fill="#2ecc71"/>
        <!-- Productivo -->
        <path d="M0,150 C100,170 200,130 300,150 400,170 500,130 600,150 700,170 800,150" fill="#3498db"/>
        <!-- Ocio -->
        <path d="M0,100 C100,120 200,80 300,100 400,120 500,80 600,100 700,120 800,100" fill="#e74c3c"/>
    </svg>
</section>
</body>
</html>
